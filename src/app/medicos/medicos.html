<p>medicos pagina!</p>
<table class="table table-dark table-hover">
    <thead>
        <tr>
            <th>id</th>
            <th>nombre</th>
            <th>apellido</th>
            <th>especialidad</th>
            <th>acciones</th>
        </tr>
    </thead>
    <tbody>
        @for (medico of listaM; track medico.id) {
        <tr>
            <td>{{ medico.id }}</td>
            <td>{{ medico.nombre }}</td>
            <td>{{ medico.apellidos }}</td>
            <td>{{ medico.especialidad }}</td>
            <td>
                <button type="button" class="btn btn-sm btn-outline-light me-1" (click)="actualizar(medico)"
                    title="Editar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                        <path
                            d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
                    </svg>
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="eliminar(medico.id)"
                    title="Eliminar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-trash3" viewBox="0 0 16 16">
                        <path
                            d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                    </svg>
                </button>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="5">No hay medicos para mostrar.</td>
        </tr>
        }
    </tbody>
</table>

<button class="btn btn-primary mt-3" (click)="nuevoMedico()">Registrar</button>

<div class="modal" tabindex="-1" id="registroMedico">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ bandera ? 'Actualizar médico' : 'Registrar médico' }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Id</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.id" name="id">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.nombre" name="nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.apellidos" name="apellidos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.especialidad" name="especialidad">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="cerrarModal()">
                            Cerrar
                        </button>
                        <button type="button" class="btn btn-primary" (click)="guardarMedico()">
                            {{ bandera ? 'Actualizar' : 'Guardar' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

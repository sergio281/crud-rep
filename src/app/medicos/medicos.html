<div class="container mt-4 mb-5">
    <!-- Tarjeta principal -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">GESTIÓN DE MÉDICOS</h4>
        </div>

        <div class="card-body">
            <!-- SECCIÓN DE BÚSQUEDA -->
            <div class="row mb-4 align-items-end">
                <div class="col-md-8 col-lg-6">
                    <label for="idMedico" class="form-label fw-bold">Id</label>
                    <div class="input-group">
                        <input type="text" id="idMedico" name="idBuscar" class="form-control"
                            placeholder="Ingrese el id del médico">
                        <button type="button" (click)="buscarMedico()" class="btn btn-primary">
                            Buscar
                        </button>
                        <!--ms-2 mt-2 -->
                        <button type="button" (click)="listarMedico()" class="btn btn-warning" title="Ver todos">
                            Ver todos
                        </button>
                    </div>
                </div>
                <div class="col-md-4 col-lg-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-success" (click)="nuevoMedico()">
                        Registrar
                    </button>
                </div>
            </div>

            <!-- SECCIÓN DE LA TABLA -->
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Apellido</th>
                            <th scope="col">Especialidad</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (medico of listaM; track medico.id) {
                        <tr>
                            <td>{{ medico.id }}</td>
                            <td>{{ medico.nombre }}</td>
                            <td>{{ medico.apellidos }}</td>
                            <td>{{ medico.especialidad }}</td>
                            <td class="text-center">
                                <button type="button" class="btn btn-sm btn-outline-light me-1"
                                    (click)="actualizar(medico)" title="Editar">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd"
                                            d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                                        <path
                                            d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
                                    </svg>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    (click)="eliminar(medico.id)" title="Eliminar">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-trash3" viewBox="0 0 16 16">
                                        <path
                                            d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5" />
                                    </svg>
                                </button>
                            </td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="5" class="text-center text-warning">No hay medicos para mostrar.</td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- SECCIÓN DEL MODAL -->
<div class="modal" tabindex="-1" id="registroMedico" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title">{{ bandera ? 'Actualizar médico' : 'Registrar médico' }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Id</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.id" name="id">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.nombre" name="nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Apellidos</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.apellidos" name="apellidos">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Especialidad</label>
                        <input type="text" class="form-control" [(ngModel)]="medico.especialidad" name="especialidad">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="cerrarModal()">
                    Cerrar
                </button>
                <button type="button" class="btn btn-primary" (click)="guardarMedico()">
                    {{ bandera ? 'Actualizar' : 'Guardar' }}
                </button>
            </div>
        </div>
    </div>
</div>
